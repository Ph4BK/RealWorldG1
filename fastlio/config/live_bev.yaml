# Temporal limits are initial engineering defaults, not measured localization accuracy.
window_frames: 10
min_points: 2
z_min: 0.05
z_max: 1.3
update_radius_m: 2.0
update_inner_radius_m: 0.3
max_window_age_s: 2.0
sensor_timeout_s: 1.0
registration_timeout_s: 6.0
# Allow callbacks to catch up without relaxing the existing 0.2 s clock check.
registration_odom_wait_s: 1.0
map_display_hz: 5.0
registration_min_fitness: 0.7
pose_sync_tolerance_s: 0.03
# Current local FAST-LIO stamps registered clouds at scan end. If the deployed
# binary stamps scan start, explicitly set its measured offset (e.g. 0.1).
cloud_stamp_offset_s: 0.0
transform_jump_translation_m: 0.25
transform_jump_rotation_deg: 10.0
cloud_topic: /cloud_registered_1
odom_topic: /Odometry_loc
imu_topic: /utlidar/imu_livox_mid360
odom_frame: camera_init
imu_seconds: 2.0
# Shared by planning preview and navigation.
fmm_inflation_cells: 5
fmm_step_cells: 10
fmm_max_stgs: 4
# Failed local selection shrinks by one cell per attempt down to this radius.
fmm_min_step_cells: 4
# Local D1-803 map coordinates, IMU reference. NOT registered to D3-619.
# p_map = R(yaw) * p_scene + [x,y]; preserve this transform for the session.
action:
  coordinate_frame: g1_d1_803_map
  map_from_scene_xy_yaw: [0.0, 0.0, 0.0]
